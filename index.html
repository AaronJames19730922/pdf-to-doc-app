<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-to-Doc | 專業 PDF 轉檔工具</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --bg: #fdf2f2;
            --text: #1f2937;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 20%, #fee2e2 0%, transparent 40%), radial-gradient(circle at 80% 80%, #fee2e2 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; color: #991b1b; letter-spacing: -1px; }
        header p { color: #7f1d1d; opacity: 0.7; font-size: 1.1rem; }

        .card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(153, 27, 27, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .drop-zone {
            border: 2px dashed #fca5a5;
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fffafa;
        }

        .drop-zone:hover { border-color: var(--primary); background: #fef2f2; transform: scale(1.01); }
        .drop-zone .icon { font-size: 50px; margin-bottom: 15px; }
        .drop-zone p { font-weight: 600; color: #991b1b; }

        .options {
            margin-top: 30px;
            padding: 25px;
            background: #fff5f5;
            border-radius: 20px;
            border: 1px solid #fee2e2;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-weight: 600;
            color: #7f1d1d;
        }

        .option-item input { width: 22px; height: 22px; cursor: pointer; accent-color: var(--primary); }

        .status-area { margin-top: 30px; display: none; }

        .progress-bar {
            height: 10px;
            background: #fee2e2;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f87171);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(239, 68, 68, 0.5); }
        .btn-primary:disabled { background: #fca5a5; cursor: not-allowed; transform: none; box-shadow: none; }

        .success-area { display: none; text-align: center; margin-top: 30px; }

        footer { margin-top: 40px; text-align: center; color: #991b1b; opacity: 0.5; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PDF-to-Doc</h1>
            <p>提取文字並轉換為 Word，支援簡繁互轉</p>
        </header>

        <div class="card">
            <div id="drop-zone" class="drop-zone">
                <div class="icon">📄</div>
                <p>點擊或拖放 PDF 檔案到這裡</p>
                <input type="file" id="file-input" accept=".pdf" hidden>
            </div>

            <div id="options-area" class="options" style="display: none;">
                <label class="option-item">
                    <input type="checkbox" id="convert-to-tw" checked>
                    <span>將簡體中文轉換為繁體中文</span>
                </label>
                <label class="option-item" style="margin-top: 10px;">
                    <input type="checkbox" id="include-images" checked>
                    <span>嘗試提取圖片 (實驗性)</span>
                </label>
            </div>

            <div id="status-area" class="status-area">
                <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #991b1b;">
                    <span id="status-text">分析中...</span>
                    <span id="percent-text">0%</span>
                </div>
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
            </div>

            <button id="convert-btn" class="btn btn-primary" style="display: none;">開始轉換為 Word</button>

            <div id="success-area" class="success-area">
                <div style="font-size: 50px; margin-bottom: 15px;">🎉</div>
                <h3>轉換完成！</h3>
                <p id="result-filename" style="color: #991b1b; opacity: 0.7; margin-bottom: 25px;"></p>
                <button id="download-btn" class="btn btn-primary">立即下載 Word 檔</button>
                <button id="reset-btn" class="btn" style="background: transparent; color: #991b1b; font-weight: 600;">轉換另一個檔案</button>
            </div>
        </div>

        <footer>
            <p>© 2026 PDF-to-Doc · 圖片提取功能目前僅支援部分 PDF 格式</p>
        </footer>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const optionsArea = document.getElementById('options-area');
        const statusArea = document.getElementById('status-area');
        const convertBtn = document.getElementById('convert-btn');
        const successArea = document.getElementById('success-area');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent-text');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');

        let selectedFile = null;
        let finalBlob = null;

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
                alert('請選擇有效的 PDF 檔案');
                return;
            }
            selectedFile = file;
            dropZone.style.display = 'none';
            optionsArea.style.display = 'block';
            convertBtn.style.display = 'block';
            successArea.style.display = 'none';
        }

        convertBtn.onclick = async () => {
            convertBtn.disabled = true;
            statusArea.style.display = 'block';
            updateStatus('正在載入 PDF...', 10);

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const numPages = pdf.numPages;
                
                let fullHtml = '<html><body>';
                const shouldConvert = document.getElementById('convert-to-tw').checked;
                const includeImages = document.getElementById('include-images').checked;
                const converter = shouldConvert ? OpenCC.Converter({ from: 'cn', to: 'tw' }) : null;

                for (let i = 1; i <= numPages; i++) {
                    const progress = 10 + Math.floor((i / numPages) * 80);
                    updateStatus(`正在解析第 ${i} 頁 / 共 ${numPages} 頁...`, progress);

                    const page = await pdf.getPage(i);
                    
                    // Extract Images if enabled
                    let pageImagesHtml = '';
                    if (includeImages) {
                        try {
                            const ops = await page.getOperatorList();
                            for (let j = 0; j < ops.fnArray.length; j++) {
                                if (ops.fnArray[j] === pdfjsLib.OPS.paintImageXObject) {
                                    const imgKey = ops.argsArray[j][0];
                                    const img = await page.objs.get(imgKey);
                                    if (img && img.data) {
                                        const canvas = document.createElement('canvas');
                                        canvas.width = img.width;
                                        canvas.height = img.height;
                                        const ctx = canvas.getContext('2d');
                                        const imgData = ctx.createImageData(img.width, img.height);
                                        
                                        // Simple RGB/RGBA copy
                                        for (let k = 0; k < img.data.length; k++) {
                                            imgData.data[k] = img.data[k];
                                        }
                                        ctx.putImageData(imgData, 0, 0);
                                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                                        pageImagesHtml += `<div style="text-align:center;"><img src="${dataUrl}" style="max-width:100%; height:auto;" /></div><br/>`;
                                    }
                                }
                            }
                        } catch (e) { console.warn('Image extraction failed for page', i, e); }
                    }

                    // Extract Text
                    const textContent = await page.getTextContent();
                    let pageText = '';
                    let lastY;
                    for (const item of textContent.items) {
                        if (lastY !== undefined && Math.abs(item.transform[5] - lastY) > 5) {
                            pageText += '<br/>';
                        }
                        pageText += item.str;
                        lastY = item.transform[5];
                    }
                    
                    if (shouldConvert) {
                        pageText = converter(pageText);
                    }
                    
                    fullHtml += `<div>${pageText}</div><br/>${pageImagesHtml}<hr/>`;
                }

                fullHtml += '</body></html>';
                updateStatus('正在生成 Word 檔案...', 95);

                const converted = htmlDocx.asBlob(fullHtml);
                finalBlob = converted;

                updateStatus('完成！', 100);
                setTimeout(() => {
                    statusArea.style.display = 'none';
                    convertBtn.style.display = 'none';
                    optionsArea.style.display = 'none';
                    successArea.style.display = 'block';
                    document.getElementById('result-filename').innerText = selectedFile.name.replace('.pdf', '.docx');
                }, 500);

            } catch (err) {
                console.error(err);
                alert('轉換失敗，請確認 PDF 檔案是否正確。');
                reset();
            }
        };

        downloadBtn.onclick = () => {
            const url = URL.createObjectURL(finalBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = selectedFile.name.replace('.pdf', '.docx');
            a.click();
        };

        resetBtn.onclick = reset;

        function reset() {
            selectedFile = null;
            finalBlob = null;
            dropZone.style.display = 'block';
            optionsArea.style.display = 'none';
            convertBtn.style.display = 'none';
            statusArea.style.display = 'none';
            successArea.style.display = 'none';
            convertBtn.disabled = false;
            fileInput.value = '';
        }

        function updateStatus(text, percent) {
            statusText.innerText = text;
            percentText.innerText = percent + '%';
            progressFill.style.width = percent + '%';
        }
    </script>
</body>
</html>
